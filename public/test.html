<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Companion Studio — Stripe Test</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 480px;
      margin: 80px auto;
      text-align: center;
      color: #1a1a1a;
    }
    button {
      background: #635bff;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
    }
    #status {
      margin-top: 20px;
      font-size: 14px;
      color: #555;
    }
    .card-hint {
      margin-top: 40px;
      font-size: 13px;
      color: #888;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }
  </style>
</head>
<body>
  <h2>Stripe Checkout Test</h2>
  <p>Click below to start a real test-mode subscription checkout.</p>

  <button id="checkoutBtn">Start Test Checkout</button>
  <div id="status"></div>

  <div class="card-hint">
    Use Stripe's test card: <strong>4242 4242 4242 4242</strong><br />
    Any future expiry date, any 3-digit CVC, any postcode.
  </div>

  <script>
    const btn = document.getElementById('checkoutBtn');
    const status = document.getElementById('status');

    const params = new URLSearchParams(window.location.search);
    if (params.get('status') === 'success') {
      status.textContent = '✅ Checkout completed! Check your Stripe Dashboard and Railway logs.';
    } else if (params.get('status') === 'cancelled') {
      status.textContent = 'Checkout was cancelled.';
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      status.textContent = 'Creating checkout session...';

      try {
        const res = await fetch('/api/test/create-test-checkout', {
          method: 'POST',
        });
        const data = await res.json();

        if (data.url) {
          window.location.href = data.url;
        } else {
          status.textContent = 'Error: ' + (data.error || 'Unknown error');
          btn.disabled = false;
        }
      } catch (err) {
        status.textContent = 'Request failed: ' + err.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
